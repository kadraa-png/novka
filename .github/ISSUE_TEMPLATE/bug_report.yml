name: Bug report
description: Something in Novka does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove amounts, names and anything else personal from text and screenshots before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Novka version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Xiaomi 13, Android 14
    validations:
      required: true
